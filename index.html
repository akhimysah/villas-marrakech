<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concierge Service · Medina First Marrakech</title>
<meta name="description" content="Villas de luxe à Marrakech de 3 à plus de 20 chambres, et services de conciergerie : spa, véhicules, excursions, événements, tables, conciergerie 24/7.">
<meta property="og:title" content="Concierge Service by Medina First Marrakech">
<meta property="og:description" content="Villas de luxe à Marrakech et services de conciergerie.">
<meta property="og:image" content="https://akhimysah.github.io/villas-marrakech/photos/hero.jpg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#9A2A22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg-2:#F7F6F3; --bg-3:#EFEDE8;
  --text:#1B1B1B; --text-2:#585858; --text-3:#8C8C8C;
  --border:#E7E5E0; --border-2:#D6D3CC;
  --accent:#9A2A22; --accent-bg:#F8ECEA; --brand:#9A2A22;
  --btn:#9A2A22; --btn-text:#FFFFFF;
  --wa:#1FAF5A; --wa-dark:#178A47;
  --ok:#1E7B4B; --ok-bg:#E4F4EA; --warn:#9A6206; --warn-bg:#FBF0D6; --no:#B23A3A; --no-bg:#FBE5E5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --shadow-lg:0 12px 40px -12px rgba(0,0,0,.28);
  --overlay:rgba(0,0,0,.55);
  --font:"Manrope","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131313; --bg-2:#1B1B1A; --bg-3:#242422;
    --text:#F1F0EC; --text-2:#B4B2AC; --text-3:#7F7E79;
    --border:#2A2A28; --border-2:#3A3A37;
    --accent:#E58A7E; --accent-bg:#3A1F1C; --brand:#9A2A22;
    --btn:#9A2A22; --btn-text:#FFFFFF;
    --ok:#7ED8A2; --ok-bg:#183626; --warn:#E6B657; --warn-bg:#3A2D12; --no:#EE9C9C; --no-bg:#3D1F1F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 12px 40px -12px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131313; --bg-2:#1B1B1A; --bg-3:#242422;
  --text:#F1F0EC; --text-2:#B4B2AC; --text-3:#7F7E79;
  --border:#2A2A28; --border-2:#3A3A37;
  --accent:#E58A7E; --accent-bg:#3A1F1C; --brand:#9A2A22;
  --btn:#9A2A22; --btn-text:#FFFFFF;
  --ok:#7ED8A2; --ok-bg:#183626; --warn:#E6B657; --warn-bg:#3A2D12; --no:#EE9C9C; --no-bg:#3D1F1F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 12px 40px -12px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.wrap{width:min(1200px,calc(100% - 2*clamp(16px,4vw,40px)));margin:0 auto}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}


/* Header */
.hdr{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border)}
.hdr .top{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}
.brand .logo{height:42px;width:auto;border-radius:4px;flex:none}
.brand .bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand .bt b{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;font-size:21px;letter-spacing:.01em}
.brand .bt small{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.hdr-r{display:flex;align-items:center;gap:10px;flex:none}
.seg{display:flex;border:1px solid var(--border-2);border-radius:999px;padding:3px;gap:2px}
.seg button{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;color:var(--text-2);transition:all .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-text)}
.tabs{border-top:1px solid var(--border)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:13px 12px 11px;font-size:14px;font-weight:600;color:var(--text-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
.tab .ico{width:17px;height:17px}
.tab:hover{color:var(--text)}
.tab[aria-current="true"]{color:var(--text);border-bottom-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;padding:11px 16px;border-radius:10px;border:1px solid var(--border-2);background:var(--bg);color:var(--text);text-decoration:none;white-space:nowrap;transition:all .15s;line-height:1.2}
.btn:hover{border-color:var(--text);background:var(--bg-2)}
.btn.dark{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.btn.dark:hover{opacity:.88}
.btn.brand-btn{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.brand-btn:hover{opacity:.9}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.wa:hover{background:var(--wa-dark);border-color:var(--wa-dark)}
.btn.wa-o{color:var(--wa-dark);border-color:var(--wa)}
.btn.wa-o:hover{background:var(--wa);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px}
.btn .ico{width:16px;height:16px}
@media (max-width:720px){.hdr .top{height:60px}.brand .logo{height:34px}.brand .bt small{display:none}.brand .bt b{font-size:18px}.hdr-r .btn span{display:none}.hdr-r .btn{padding:8px 10px}}
@media (max-width:420px){.brand .bt{display:none}}

/* Hero */
.hero{position:relative;min-height:500px;display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#2a1a17}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.74) 0%,rgba(0,0,0,.28) 55%,rgba(0,0,0,.12) 100%)}
.hero .wrap{position:relative;z-index:1;padding:64px 0 40px}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);padding:7px 12px;border-radius:999px;margin-bottom:18px;color:#fff}
.kick .ico{width:15px;height:15px}
.hero h1{font-size:clamp(34px,5.5vw,58px);font-weight:800;letter-spacing:-.025em;max-width:16ch;color:#fff}
.hero p{font-size:clamp(15px,1.6vw,18px);color:rgba(255,255,255,.88);max-width:58ch;margin:14px 0 26px;font-weight:500}
.search{background:var(--bg);color:var(--text);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-lg);flex-wrap:wrap}
.search .lbl{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--border-2);text-decoration:none;color:var(--text);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--text)}
.chip[aria-current="true"]{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.chip small{color:inherit;opacity:.6;margin-left:5px;font-weight:600}
.search .cnt{margin-left:auto;font-size:14px;color:var(--text-2);font-weight:600;padding:0 6px}
.hero.svc{min-height:420px}
.hero.svc h1{max-width:20ch}
@media (max-width:640px){.hero{min-height:440px}.hero .wrap{padding:48px 0 24px}.search .cnt{display:none}.hero.svc{min-height:360px}}

.hero-credit{position:absolute;right:16px;top:16px;z-index:2;font-size:12px;font-weight:700;color:#fff;text-decoration:none;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);padding:7px 12px;border-radius:999px}
.hero-credit:hover{background:rgba(0,0,0,.55)}
.hero.svc>img{object-position:center 40%}
.hero.home{min-height:620px}
.hero.home>img{object-position:center 72%}
@media (max-width:640px){.hero.home{min-height:440px}.hero.home>img{object-position:center 60%}}
/* Sections & cards */
.group{padding:40px 0 8px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px}
.group-head h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.group-head span{font-size:14px;color:var(--text-3);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 24px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.grid{grid-template-columns:1fr;gap:28px}}
.card{display:block;text-decoration:none;color:inherit}
.car{position:relative;border-radius:16px;overflow:hidden;background:var(--bg-3);aspect-ratio:4/3}
.car .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car .track::-webkit-scrollbar{display:none}
.car .track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.car .nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);color:#1b1b1b;display:grid;place-items:center;opacity:0;transition:opacity .15s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.car .nav.l{left:10px}.car .nav.r{right:10px}
.car:hover .nav{opacity:1}
.car .nav .ico{width:16px;height:16px}
.car .ctr{position:absolute;right:10px;bottom:10px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:4px 8px;border-radius:999px}
:root[data-theme="dark"] .card .t{margin-top:12px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card h3{font-size:16px;font-weight:700}
.card .loc{font-size:14px;color:var(--text-2);margin-top:2px}
.card .facts{font-size:14px;color:var(--text-2);margin-top:4px}
.card:hover h3{text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--text-3);padding:24px 0}

/* Villa page */
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text-2);padding:18px 0 14px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:var(--text-3)}
.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.title-row h1{font-size:clamp(26px,3.4vw,34px);font-weight:800;letter-spacing:-.025em}
.title-row .meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--text-2);font-size:14px;margin-top:8px;align-items:center}
.title-row .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-3)}
.title-row .acts{display:flex;gap:8px}
.mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:230px 230px;gap:8px;border-radius:18px;overflow:hidden;position:relative;background:var(--bg-3)}
.mosaic button{overflow:hidden;background:var(--bg-3);position:relative}
.mosaic button:first-child{grid-row:span 2}
.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.mosaic button:hover img{transform:scale(1.03)}
.mosaic .all{position:absolute;right:16px;bottom:16px;z-index:2}
@media (max-width:760px){.mosaic{grid-template-columns:1fr;grid-template-rows:280px}.mosaic button:not(:first-child){display:none}.mosaic button:first-child{grid-row:auto}}
.vbody{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;margin-top:32px}
@media (max-width:960px){.vbody{grid-template-columns:1fr;gap:32px}}
.sec{padding:28px 0;border-bottom:1px solid var(--border)}
.sec h2{font-size:21px;font-weight:800;letter-spacing:-.015em;margin-bottom:12px}
.sec p{color:var(--text-2);margin:0 0 10px;max-width:70ch;font-size:15.5px}
.sec p:last-child{margin-bottom:0}
.sec .lead{font-size:17px;color:var(--text)}
.amen{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px;list-style:none;padding:0;margin:0}
.amen li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text-2)}
.amen .ico{color:var(--ok);width:18px;height:18px}
@media (max-width:560px){.amen{grid-template-columns:1fr}}
.side{position:sticky;top:92px;align-self:start;border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--shadow);background:var(--bg)}
.side .acts{display:flex;flex-direction:column;gap:8px}
.side .acts .btn{width:100%;padding:13px 16px}
.side .linkbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.side .linkbox label{font-size:12px;font-weight:700;color:var(--text-2)}
.side .linkbox input{width:100%;font:inherit;font-size:12.5px;padding:9px 10px;border:1px solid var(--border-2);border-radius:8px;background:var(--bg-2);color:var(--text-2);margin-top:6px}


/* Villa page sections */
.v-meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--text-2);font-size:14px;margin-top:8px;align-items:center}
.v-meta .ico{width:16px;height:16px;color:var(--accent)}
.v-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-3)}
.sec h2{display:flex;align-items:center;gap:10px}
.sec h2 .ico{width:22px;height:22px;color:var(--accent)}
.dist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.dist div{border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.dist small{display:block;font-size:12.5px;color:var(--text-3);font-weight:600}
.dist b{font-size:15px}
@media (max-width:560px){.dist{grid-template-columns:1fr}}
.facts4{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px}
.facts4 div{padding:14px 16px;border-right:1px solid var(--border)}
.facts4 div:last-child{border-right:0}
.facts4 small{display:block;font-size:12px;color:var(--text-3);font-weight:600}
.facts4 b{font-size:17px;font-weight:800}
@media (max-width:640px){.facts4{grid-template-columns:repeat(2,1fr)}.facts4 div:nth-child(2){border-right:0}.facts4 div:nth-child(-n+2){border-bottom:1px solid var(--border)}}
.notes{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.notes li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);color:var(--text-2);font-size:15px}
.notes li:last-child{border-bottom:0}
.notes .ico{width:18px;height:18px;color:var(--accent);margin-top:2px}
.side h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
.side .sub{font-size:14px;color:var(--text-2);margin:6px 0 16px}
.side .svc-links{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.side .svc-links h4{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.side .svc-links a{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;font-weight:600;text-decoration:none;color:var(--text)}
.side .svc-links a:hover{color:var(--accent)}
.side .svc-links .ico{width:17px;height:17px;color:var(--accent)}

/* Services */
.svc-sec{padding:56px 0 8px}
.svc-sec .head{max-width:640px;margin-bottom:24px}
.svc-sec h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.svc-sec .head p{color:var(--text-2);margin:8px 0 0;font-size:16px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:980px){.svc-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.svc-grid{grid-template-columns:1fr}}
.svc-card{display:block;text-decoration:none;color:inherit;border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:all .15s;background:var(--bg)}
.svc-card:hover{box-shadow:var(--shadow);border-color:var(--border-2)}
.svc-card .im{aspect-ratio:16/10;overflow:hidden;background:var(--bg-3)}
.svc-card .im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.svc-card:hover .im img{transform:scale(1.04)}
.svc-card .tx{padding:16px 18px 18px}
.svc-card h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.svc-card h3 .ico{width:19px;height:19px;color:var(--accent)}
.svc-card p{margin:6px 0 10px;color:var(--text-2);font-size:14.5px}
.svc-card .go{font-size:14px;font-weight:700;color:var(--accent)}
.svc-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:56px;margin-top:40px}
@media (max-width:960px){.svc-body{grid-template-columns:1fr;gap:28px}}
.svc-body .intro{font-size:18px;line-height:1.6;color:var(--text);margin:0 0 8px;max-width:64ch}
.offers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:640px){.offers{grid-template-columns:1fr}}
.offer{border:1px solid var(--border);border-radius:14px;padding:18px}
.offer h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.offer h3 .ico{width:18px;height:18px;color:var(--accent)}
.offer p{margin:6px 0 0;color:var(--text-2);font-size:14.5px}
.svc-photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.svc-photos button{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--bg-3)}
.svc-photos img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.svc-photos button:hover img{transform:scale(1.04)}
@media (max-width:640px){.svc-photos{grid-template-columns:repeat(2,1fr)}}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px}
.steps b{display:block;font-size:15px}
.steps span{color:var(--text-2);font-size:14px}
.cta-band{margin-top:48px;border-radius:18px;background:var(--brand);color:#fff;padding:32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.cta-band h2{font-size:24px;font-weight:800;color:#fff}
.cta-band p{margin:6px 0 0;color:rgba(255,255,255,.85)}
.cta-band .btn.wa{border-color:#fff}


/* Vignette en attendant les photos */
.ph-brand{width:100%;height:100%;flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--brand);color:#fff;text-align:center;padding:16px}
.ph-brand img,.car .track .ph-brand img{flex:none;height:34px;width:auto;object-fit:contain;border:1px solid rgba(255,255,255,.35);border-radius:3px}
.ph-brand b{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600;letter-spacing:.02em}
.ph-brand span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.ph-brand.big{aspect-ratio:21/8;border-radius:18px;gap:14px}
.ph-brand.big img{height:56px}
.ph-brand.big b{font-size:clamp(30px,4vw,44px)}
@media (max-width:760px){.ph-brand.big{aspect-ratio:4/3}}
.subh{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin:20px 0 10px}
.amen li span{min-width:0}
.loc-list .ico{color:var(--accent)}

/* Gallery */
.gallery{margin-top:40px;padding-top:28px;border-top:1px solid var(--border)}
.gallery h2{font-size:22px;font-weight:800;letter-spacing:-.015em}
.g-cat{font-size:14px;font-weight:700;color:var(--text-2);margin:24px 0 10px;display:flex;justify-content:space-between}
.g-cat span{color:var(--text-3);font-weight:600}
.g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:700px){.g-grid{grid-template-columns:repeat(2,1fr)}}
.g-grid button{aspect-ratio:4/3;overflow:hidden;background:var(--bg-3);border-radius:12px;position:relative}
.g-grid img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.g-grid button:hover img{transform:scale(1.03)}
.g-grid .i{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:999px}
.ph-empty{width:100%;height:100%;display:grid;place-items:center;color:var(--text-3);background:var(--bg-3);font-size:12px;font-weight:600;gap:6px}
.ph-empty .ico{width:26px;height:26px}

/* Prev / next */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px}
.pn a{display:flex;gap:14px;align-items:center;text-decoration:none;border:1px solid var(--border);border-radius:14px;padding:12px;transition:all .15s}
.pn a:hover{border-color:var(--text);box-shadow:var(--shadow)}
.pn a.next{flex-direction:row-reverse;text-align:right}
.pn img{width:84px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.pn small{display:block;font-size:12px;color:var(--text-3);font-weight:600}
.pn b{font-size:15px}
@media (max-width:560px){.pn{grid-template-columns:1fr}}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;flex-direction:column}
.lb img{max-width:min(94vw,1400px);max-height:82vh;object-fit:contain;border-radius:8px}
.lb .lb-cap{color:#ddd;font-size:13px;font-weight:600;margin-top:14px}
.lb button{position:absolute;color:#fff;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.12)}
.lb button:hover{background:rgba(255,255,255,.22)}
.lb .x{top:16px;right:16px}.lb .prev{left:16px;top:50%;transform:translateY(-50%)}.lb .next{right:16px;top:50%;transform:translateY(-50%)}
.lb .ico{width:20px;height:20px}

/* Footer */
footer{margin-top:64px;background:var(--bg-2);border-top:1px solid var(--border);padding:40px 0 28px;color:var(--text-2);font-size:14px}
footer .wrap{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:32px;align-items:start}
@media (max-width:760px){footer .wrap{grid-template-columns:1fr}}
footer h4{margin:0 0 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text)}
footer .fl{flex-direction:column;gap:8px}
footer .flogo{height:46px;width:auto;border-radius:4px;margin-bottom:12px}
footer .fnote{max-width:52ch}
footer .fl{display:flex;gap:14px;flex-wrap:wrap}
footer .fl a{text-decoration:none;font-weight:600}
footer .fl a:hover{text-decoration:underline}
footer .copy{grid-column:1/-1;padding-top:20px;margin-top:8px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-3)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--btn);color:var(--btn-text);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:200;transition:all .25s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* =====================================================================
   2. TRI AUTOMATIQUE DES PHOTOS
   Analyse le nom de fichier (ou la légende) en FR / EN / NL / ES.
   Ordre : extérieur & piscine -> entrée -> salon -> salle à manger -> cuisine
           -> bien-être -> autres -> chambres (regroupées par numéro)
           -> salles de bain (toujours en dernier, dans l'ordre des chambres)
   ===================================================================== */
const RX = {
  bathroom:/(\bsdb\b|s\.d\.b|salle[\s_-]*d[e']?[\s_-]*(bain|eau)|bathroom|bath\b|shower|douche|badkamer|\bbad\b|ba[ñn]o|toilet|toilette|\bwc\b|en[\s_-]?suite)/i,
  bedroom:/(chambre|\bch[\s_-]?\d|bedroom|\bbed\b|suite|master|parentale|slaapkamer|\bkamer|dormitorio|habitaci[oó]n)/i,
  exterior:/(ext[ée]rieur|exterior|fa[çc]ade|jardin|garden|tuin|jard[ií]n|piscine|pool|zwembad|piscina|terrasse|terrace|terras|terraza|patio|\bvue\b|view|uitzicht|vista|drone|a[ée]rien|aerial|rooftop|toit|\bdak\b|azotea|pergola|bassin|palmeraie|olivier|olive|sunset|coucher|pool[\s_-]?house|outdoor|buiten|fuera|all[ée]e|jeux|playground|speeltuin|juegos|parking|tennis|p[ée]tanque|football)/i,
  entrance:/(entr[ée]e|entrance|ingang|entrada|hall|porte|door|deur|puerta|couloir|corridor|gang|pasillo)/i,
  living:/(salon|living|lounge|woonkamer|zitkamer|sal[oó]n|\bsala\b|s[ée]jour|chemin[ée]e|fireplace|\btv\b|biblioth|library|cin[ée]ma|bureau|office|kantoor|despacho)/i,
  dining:/(salle[\s_-]*[àa][\s_-]*manger|dining|eetkamer|comedor|\bsam\b)/i,
  kitchen:/(cuisine|kitchen|keuken|cocina)/i,
  wellness:/(spa|hammam|sauna|gym|fitness|massage|jacuzzi|yoga|wellness|bien[\s_-]?[êe]tre)/i
};
const CAT_ORDER = ["exterior","entrance","living","dining","kitchen","wellness","other","bedroom","bathroom"];
const BEDNUM = /(?:chambre|\bch|bedroom|\bbed|suite|slaapkamer|kamer|dormitorio|habitaci[oó]n)[\s_.-]*#?\s*(\d{1,2})/i;

function classifyPhoto(p){
  const name = (p.file||"")+" "+(p.caption||"");
  const isBath = RX.bathroom.test(name);
  const isBed  = RX.bedroom.test(name);
  let cat = "other", bed = 0;
  if(isBath) cat = "bathroom";
  else if(isBed) cat = "bedroom";
  else if(RX.exterior.test(name)) cat = "exterior";
  else if(RX.kitchen.test(name)) cat = "kitchen";
  else if(RX.dining.test(name)) cat = "dining";
  else if(RX.living.test(name)) cat = "living";
  else if(RX.entrance.test(name)) cat = "entrance";
  else if(RX.wellness.test(name)) cat = "wellness";
  let rest = name;
  if(cat==="bedroom"||cat==="bathroom"){
    const m = name.match(BEDNUM);
    if(m){ bed = parseInt(m[1],10); rest = name.replace(m[0]," "); }
    else if(/master|parentale|principal|hoofd/i.test(name)) bed = 1;
    else { const n = name.match(/(?<!\d)(\d{1,2})(?!\d)/); if(n){ bed = parseInt(n[1],10); rest = name.replace(n[0]," "); } else bed = 99; } // sans numéro : après les chambres numérotées
  }
  // numéro de séquence : dernier nombre restant dans le nom (hors numéro de chambre)
  const nums = rest.replace(/\.[a-z0-9]+$/i,"").match(/\d+/g)||[];
  const seq = nums.length ? parseInt(nums[nums.length-1],10) : 0;
  return {cat, bed, seq};
}
function sortPhotos(photos){
  return photos.map((p,i)=>({...p,i,...classifyPhoto(p)}))
    .sort((a,b)=> (CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat)) || (a.bed-b.bed) || (a.seq-b.seq) || (a.file||"").localeCompare(b.file||"",undefined,{numeric:true,sensitivity:"base"}) || (a.i-b.i));
}

at":"other"},{"src":"photos/v/villa-zaya-route-d-amizmiz/013.jpg","cat":"bedroom"},{"src":"photos/v/villa-zaya-route-d-amizmiz/014.jpg","cat":"bedroom"},{"src":"photos/v/villa-zaya-route-d-amizmiz/015.jpg","cat":"bedroom"},{"src":"photos/v/villa-zaya-route-d-amizmiz/016.jpg","cat":"bathroom"}]}];

<script>
/* =====================================================================
   5. APPLICATION : routes, rendu, partage
   Liens : #/fr                  -> onglet Villas
           #/fr/chambres/5       -> villas de 5 chambres (20+ = 20 chambres et plus)
           #/fr/villa/<slug>     -> fiche d'une villa
           #/fr/service/<id>     -> onglet d'un service (spa, vehicules, activites, evenements, tables, conciergerie)
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tx = (o,l) => typeof o==="string" ? o : (o?.[l] ?? o?.fr ?? o?.en ?? "");
const groupOf = v => v.bedrooms==null ? "?" : v.bedrooms>=20 ? "20+" : String(v.bedrooms);
const groupRank = g => g==="?" ? 999 : g==="20+" ? 20 : +g;
const GROUPS = () => [...new Set(VILLAS.map(groupOf))].sort((a,b)=>groupRank(a)-groupRank(b));
const ORDERED = () => [...VILLAS].sort((a,b)=>(a.bedrooms??999)-(b.bedrooms??999)||a.name.localeCompare(b.name,"fr"));
const plural = (n,one,many) => `${n} ${n===1?one:many}`;
// Photos déjà triées à la génération (champ cat) ; sinon tri automatique par nom de fichier
const sorted = v => v._sorted || (v._sorted = (v.photos||[]).length && v.photos[0].cat
  ? v.photos.map((p,i)=>({...p,i,bed:0}))
  : sortPhotos(v.photos||[]));
const svcPhoto = id => `photos/svc-${id}.jpg`;
const list = (arr,l) => (arr||[]).map(x=>tx(x,l)).filter(Boolean);
const areaOf = (v,l) => tx((v.location||[])[0],l);
const brandPh = (v,l,big) => `<div class="ph-brand${big?" big":""}"><img src="logo.png" alt=""><b>${esc(v.name)}</b><span>${UI[l].photosSoon}</span></div>`;

let state = {lang:"fr", view:"villas", slug:null, group:null, svc:null};
function parseHash(){
  const parts = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  let lang = LANGS.includes(parts[0]) ? parts.shift() : null;
  if(!lang){ const nav=(navigator.language||"fr").slice(0,2).toLowerCase(); lang = LANGS.includes(nav)?nav:"fr"; }
  if(parts[0]==="villa" && parts[1]) return {lang, view:"villa", slug:parts[1]};
  if(parts[0]==="service" && parts[1]) return {lang, view:"service", svc:parts[1]};
  if(parts[0]==="chambres" && parts[1]) return {lang, view:"villas", group:decodeURIComponent(parts[1])};
  return {lang, view:"villas"};
}
const linkVillas = (l,g) => `#/${l}` + (g?`/chambres/${encodeURIComponent(g)}`:"");
const linkVilla = (l,slug) => `#/${l}/villa/${slug}`;
const linkSvc = (l,id) => `#/${l}/service/${id}`;
const linkSame = l => state.view==="villa" ? linkVilla(l,state.slug) : state.view==="service" ? linkSvc(l,state.svc) : linkVillas(l,state.group);
const absolute = h => location.href.split("#")[0] + h;
const waShare = text => "https://wa.me/?text=" + encodeURIComponent(text);
const waAsk = text => (BRAND.whatsapp ? `https://wa.me/${BRAND.whatsapp}?text=` : "https://wa.me/?text=") + encodeURIComponent(text);

/* ---------- Onglets ---------- */
function renderTabs(){
  const l=state.lang, T=UI[l];
  const tabs=[{href:linkVillas(l),icon:"home",label:T.tabVillas,on:state.view!=="service"}]
    .concat(SERVICES.map(s=>({href:linkSvc(l,s.id),icon:s.icon,label:tx(s.tab,l),on:state.view==="service"&&state.svc===s.id})));
  $("#tabs").innerHTML = tabs.map(t=>`<a class="tab" href="${t.href}" aria-current="${t.on}">${ICONS[t.icon]}${esc(t.label)}</a>`).join("");
  const cur=$("#tabs .tab[aria-current='true']"); if(cur) cur.scrollIntoView({block:"nearest",inline:"nearest"});
}

/* ---------- Onglet Villas ---------- */
function chipsHTML(l){
  const T=UI[l]; const groups=GROUPS();
  const count=g=>VILLAS.filter(v=>groupOf(v)===g).length;
  return `<a class="chip" href="${linkVillas(l)}" aria-current="${!state.group}">${T.all}<small class="num">${VILLAS.length}</small></a>` +
    groups.map(g=>`<a class="chip" href="${linkVillas(l,g)}" aria-current="${state.group===g}">${T.chip(g)}<small class="num">${count(g)}</small></a>`).join("");
}
// Photo d'accueil : une villa tirée au hasard parmi les plus belles couvertures
const HERO_VILLAS = ["villa-melrose","villa-sierra","villa-alya","villa-bel-air","villa-hampton","villa-majestic","villa-palm-angels","villa-manor-hills"];
let heroPick = null;
function heroVilla(){
  if(heroPick) return heroPick;
  const pool = HERO_VILLAS.map(s=>VILLAS.find(v=>v.slug===s)).filter(v=>v && sorted(v)[0]);
  const list = pool.length ? pool : VILLAS.filter(v=>sorted(v)[0]);
  return heroPick = list[Math.floor(Math.random()*list.length)] || null;
}
function renderVillas(){
  const l=state.lang, T=UI[l];
  const shown = GROUPS().filter(g=>!state.group || g===state.group);
  let html = `
  <section class="hero home"><img src="photos/hero.jpg" alt="Villa à Marrakech"><div class="wrap">
    <div class="kick">${ICONS.pin} ${T.heroKicker}</div>
    <h1>${T.heroTitle}</h1>
    <p>${T.heroSub}</p>
    <div class="search"><span class="lbl">${T.byBedrooms}</span><div class="chips">${chipsHTML(l)}</div><span class="cnt num">${plural(VILLAS.length,T.villa1,T.villas)}</span></div>
  </div></section>`;
  if(!shown.length) html += `<div class="wrap"><p class="empty">${T.noVillas}</p></div>`;
  for(const g of shown){
    const vs = ORDERED().filter(v=>groupOf(v)===g);
    html += `<section class="group" id="g-${g.replace("+","plus")}"><div class="wrap">
      <div class="group-head"><h2>${T.groupTitle(g)}</h2><span class="num">${plural(vs.length,T.villa1,T.villas)}</span></div>
      <div class="grid">${vs.map(v=>cardHTML(v,l)).join("")}</div>
    </div></section>`;
  }
  html += servicesSection(l, null);
  return html;
}
function cardHTML(v,l){
  const T=UI[l]; const all=sorted(v); const ph=all.slice(0,6);
  return `<a class="card" href="${linkVilla(l,v.slug)}">
    <div class="car"><div class="track" data-n="${Math.max(ph.length,1)}">${ph.length?ph.map(p=>imgTag(p,l,'loading="lazy"')).join(""):brandPh(v,l)}</div>
      ${ph.length>1?`<button class="nav l" data-car="-1" aria-label="Previous">${ICONS.left}</button><button class="nav r" data-car="1" aria-label="Next">${ICONS.right}</button>`:""}
      ${all.length?`<span class="ctr num">1 / ${all.length}</span>`:""}</div>
    <div class="t"><h3>${esc(v.name)}</h3></div>
    <div class="loc">${esc(areaOf(v,l))}</div>
    <div class="facts num">${v.bedrooms!=null?`${v.bedrooms} ${v.bedrooms===1?T.bedroom1:T.bedrooms}`:T.onAsk}${v.capacity?` · ${T.guestsN(v.capacity)}`:""}</div></a>`;
}
function servicesSection(l, exceptId){
  const T=UI[l]; const list=SERVICES.filter(s=>s.id!==exceptId);
  return `<section class="svc-sec"><div class="wrap">
    <div class="head"><h2>${exceptId?T.otherServices:T.ourServices}</h2>${exceptId?"":`<p>${T.ourServicesSub}</p>`}</div>
    <div class="svc-grid">${list.map(s=>`<a class="svc-card" href="${linkSvc(l,s.id)}"><div class="im"><img loading="lazy" src="${svcPhoto(s.id)}" alt="${esc(tx(s.title,l))}"></div>
      <div class="tx"><h3>${ICONS[s.icon]}${esc(tx(s.title,l))}</h3><p>${esc(tx(s.tagline,l))}</p><span class="go">${T.discover} →</span></div></a>`).join("")}</div>
  </div></section>`;
}

/* ---------- Fiche villa : 1. Nom  2. Localisation  3. Description  4. Services & équipements  5. Autres informations ---------- */
function renderVilla(v){
  const l=state.lang, T=UI[l];
  const photos=sorted(v);
  const link=absolute(linkVilla(l,v.slug));
  const share=waShare(T.waVilla([v.name, areaOf(v,l), v.bedrooms!=null?`${v.bedrooms} ${T.bedrooms}`:"", v.capacity?T.guestsN(v.capacity):""].filter(Boolean).join(" · "), link));
  const ask=waAsk(T.waAskVilla(v.name, link));
  const groupsG=[]; for(const p of photos){ let g=groupsG.find(x=>x.cat===p.cat); if(!g){ g={cat:p.cat,label:p.cat==="bedroom"?T.infoBedrooms:p.cat==="bathroom"?T.infoBathrooms:T.cats[p.cat],items:[]}; groupsG.push(g);} g.items.push(p); }
  let idx=0;
  const galleryHTML=groupsG.map(g=>`<div class="g-cat"><span style="color:var(--text)">${esc(g.label)}</span><span class="num">${g.items.length}</span></div><div class="g-grid">${g.items.map(p=>{const i=idx++;return `<button data-lb="${i}" aria-label="${esc(photoLabel(p,l))}">${imgTag(p,l,'loading="lazy"')}<span class="i num">${i+1}/${photos.length}</span></button>`;}).join("")}</div>`).join("");
  window.__lb=photos.map(p=>({src:photoSrc(p),cap:photoLabel(p,l)}));
  const mosaic=photos.slice(0,5);
  const locs=list(v.location,l), feats=list(v.features,l), inc=list(v.included,l), req=list(v.onRequest,l), info=list(v.info,l);
  const ul=(arr,cls="amen")=>`<ul class="${cls}">${arr.map(x=>`<li>${ICONS.check}<span>${esc(x)}</span></li>`).join("")}</ul>`;
  const ord=ORDERED(); const i=ord.findIndex(x=>x.slug===v.slug); const prev=ord[(i-1+ord.length)%ord.length], next=ord[(i+1)%ord.length];
  return `
  <div class="wrap">
    <nav class="crumbs"><a href="${linkVillas(l)}">${T.catalogue}</a><span class="sep">›</span><a href="${linkVillas(l,groupOf(v))}">${T.groupTitle(groupOf(v))}</a><span class="sep">›</span><span>${esc(v.name)}</span></nav>
    <div class="title-row">
      <div><h1>${esc(v.name)}</h1>
        <div class="v-meta">${ICONS.pin}<span>${esc(locs.slice(0,2).join(" · "))}</span>${v.bedrooms!=null?`<i class="dot"></i><span class="num">${v.bedrooms} ${T.bedrooms}</span>`:""}${v.capacity?`<i class="dot"></i><span class="num">${T.guestsN(v.capacity)}</span>`:""}</div></div>
      <div class="acts"><a class="btn wa-o sm" href="${share}" target="_blank" rel="noopener">${ICONS.wa}<span>${T.share}</span></a><button class="btn sm" data-copy="${esc(link)}">${ICONS.copy}<span>${T.copy}</span></button></div>
    </div>
    ${mosaic.length?`<div class="mosaic">${mosaic.map((p,k)=>`<button data-lb="${k}" aria-label="${esc(photoLabel(p,l))}">${imgTag(p,l)}</button>`).join("")}<button class="btn sm all" data-lb="0">${ICONS.grid}<span>${T.seeAll(photos.length)}</span></button></div>`:brandPh(v,l,true)}
    <div class="vbody">
      <div>
        <section class="sec"><h2>${ICONS.pin}${T.secLocation}</h2>${ul(locs,"amen loc-list")}</section>
        <section class="sec"><h2>${ICONS.text}${T.secDescription}</h2><p class="lead">${esc(T.leadV(v.bedrooms,v.capacity))}</p>${ul(feats)}
          ${(v.blocks||[]).map(b=>`<h3 class="subh">${esc(tx(b.title,l))}</h3>${ul(list(b.items,l))}`).join("")}</section>
        <section class="sec"><h2>${ICONS.sparkle}${T.secAmenities}</h2>
          ${inc.length?`<h3 class="subh">${T.included}</h3>${ul(inc)}`:""}
          ${req.length?`<h3 class="subh">${T.onRequest}</h3>${ul(req)}`:""}
          ${!inc.length&&!req.length?`<p>${T.noServices}</p>`:""}</section>
        <section class="sec" style="border-bottom:0"><h2>${ICONS.info}${T.secInfo}</h2>
          <div class="facts4">
            <div><small>${T.infoBedrooms}</small><b class="num">${v.bedrooms??T.onAsk}</b></div>
            <div><small>${T.infoGuests}</small><b class="num">${v.capacity?T.guestsN(v.capacity):T.onAsk}</b></div>
            <div><small>${T.infoBathrooms}</small><b class="num">${v.bathrooms??"—"}</b></div>
            <div><small>${T.infoSurface}</small><b class="num">${v.surface?v.surface+" m²":"—"}</b></div>
          </div>
          ${info.length?ul(info,"notes"):""}</section>
      </div>
      <aside class="side">
        <h3>${T.interested}</h3>
        <p class="sub">${T.interestedSub}</p>
        <div class="acts">
          <a class="btn wa" href="${ask}" target="_blank" rel="noopener">${ICONS.wa}${T.ask}</a>
          <a class="btn" href="${share}" target="_blank" rel="noopener">${ICONS.wa}${T.share}</a>
          <button class="btn" data-copy="${esc(link)}">${ICONS.copy}${T.copy}</button>
        </div>
        <div class="linkbox"><label>${T.linkLabel}</label><input readonly value="${esc(link)}" onclick="this.select()"></div>
        <div class="svc-links"><h4>${T.addServices}</h4>${SERVICES.map(s=>`<a href="${linkSvc(l,s.id)}">${ICONS[s.icon]}${esc(tx(s.title,l))}</a>`).join("")}</div>
      </aside>
    </div>
    ${photos.length?`<section class="gallery"><h2>${T.gallery} <span class="num" style="color:var(--text-3);font-weight:600">(${photos.length})</span></h2>${galleryHTML}</section>`:""}
    <nav class="pn">
      <a class="prev" href="${linkVilla(l,prev.slug)}">${sorted(prev)[0]?imgTag(sorted(prev)[0],l):`<img src="logo-square.png" alt="">`}<div><small>← ${T.prevVilla}</small><b>${esc(prev.name)}</b></div></a>
      <a class="next" href="${linkVilla(l,next.slug)}">${sorted(next)[0]?imgTag(sorted(next)[0],l):`<img src="logo-square.png" alt="">`}<div><small>${T.nextVilla} →</small><b>${esc(next.name)}</b></div></a>
    </nav>
  </div>`;
}

/* ---------- Onglet service ---------- */
function renderService(s){
  const l=state.lang, T=UI[l];
  const ask=waAsk(T.waAskService(tx(s.title,l)));
  window.__lb=[{src:svcPhoto(s.id),cap:tx(s.title,l)}];
  return `
  <section class="hero svc"><img src="${svcPhoto(s.id)}" alt="${esc(tx(s.title,l))}"><div class="wrap">
    <div class="kick">${ICONS[s.icon]} ${esc(tx(s.title,l))}</div>
    <h1>${esc(tx(s.tagline,l))}</h1>
    <p>${esc(tx(s.intro,l))}</p>
    <a class="btn wa" href="${ask}" target="_blank" rel="noopener">${ICONS.wa}${T.requestService}</a>
  </div></section>
  <div class="wrap">
    <div class="svc-body">
      <div>
        <section class="sec" style="border-bottom:0"><h2>${T.whatWeOffer}</h2>
          <div class="offers">${s.items.map(it=>`<div class="offer"><h3>${ICONS.check}${esc(tx(it,l))}</h3></div>`).join("")}</div>
          <p class="lead" style="margin-top:18px">${esc(tx(s.closing,l))}</p></section>
      </div>
      <aside class="side">
        <h3>${T.howItWorks}</h3>
        <ol class="steps" style="margin-top:14px">${T.steps.map(([a,b])=>`<li><div><b>${a}</b><span>${b}</span></div></li>`).join("")}</ol>
        <div class="acts" style="margin-top:18px"><a class="btn wa" href="${ask}" target="_blank" rel="noopener">${ICONS.wa}${T.requestService}</a></div>
      </aside>
    </div>
  </div>
  ${servicesSection(l, s.id)}`;
}

/* ---------- Carrousel des cartes ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-car]"); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const track=b.parentElement.querySelector(".track"); const w=track.clientWidth; const n=+track.dataset.n;
  let i=Math.round(track.scrollLeft/w)+(+b.dataset.car); i=(i+n)%n; track.scrollTo({left:i*w,behavior:"smooth"});
},true);
document.addEventListener("scroll",e=>{ const t=e.target; if(!(t instanceof Element)||!t.classList.contains("track")) return; const c=t.parentElement.querySelector(".ctr"); if(c) c.textContent=`${Math.round(t.scrollLeft/t.clientWidth)+1} / ${c.textContent.split("/")[1].trim()}`; },true);

/* ---------- Lightbox ---------- */
let lbIndex=0;
function openLb(i){ lbIndex=i; let el=$("#lb"); if(!el){ el=document.createElement("div"); el.id="lb"; el.className="lb"; el.innerHTML=`<button class="x" aria-label="Close">${ICONS.x}</button><button class="prev" aria-label="Previous">${ICONS.left}</button><img alt=""><button class="next" aria-label="Next">${ICONS.right}</button><div class="lb-cap"></div>`; document.body.appendChild(el);
    el.querySelector(".x").onclick=closeLb; el.querySelector(".prev").onclick=()=>stepLb(-1); el.querySelector(".next").onclick=()=>stepLb(1); el.addEventListener("click",e=>{if(e.target===el)closeLb();}); }
  updateLb(); document.body.style.overflow="hidden"; }
function updateLb(){ const el=$("#lb"); const it=window.__lb[lbIndex]; el.querySelector("img").src=it.src; el.querySelector(".lb-cap").textContent=`${it.cap} · ${lbIndex+1} / ${window.__lb.length}`; }
function stepLb(d){ lbIndex=(lbIndex+d+window.__lb.length)%window.__lb.length; updateLb(); }
function closeLb(){ const el=$("#lb"); if(el) el.remove(); document.body.style.overflow=""; }
document.addEventListener("keydown",e=>{ if(!$("#lb")) return; if(e.key==="Escape")closeLb(); if(e.key==="ArrowLeft")stepLb(-1); if(e.key==="ArrowRight")stepLb(1); });

/* ---------- Actions ---------- */
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }
async function copyText(s){ try{ await navigator.clipboard.writeText(s); toast(UI[state.lang].copied); }catch(e){ const i=document.createElement("input"); i.value=s; document.body.appendChild(i); i.select(); try{document.execCommand("copy"); toast(UI[state.lang].copied);}catch(_){ prompt("", s); } i.remove(); } }
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-copy]"); if(c){ copyText(c.dataset.copy); return; }
  const b=e.target.closest("[data-lb]"); if(b && window.__lb && window.__lb.length){ openLb(+b.dataset.lb); return; }
});

/* ---------- Rendu global ---------- */
function render(){
  state=parseHash(); closeLb();
  const l=state.lang, T=UI[l];
  document.documentElement.lang=l;
  $("#langs").innerHTML=LANGS.map(x=>`<button aria-pressed="${x===l}" data-lang="${x}">${x.toUpperCase()}</button>`).join("");
  $("#langs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ location.hash=linkSame(b.dataset.lang); });
  $("#brandLink").setAttribute("href",linkVillas(l));
  $("#footNote").textContent=T.footNote; $("#footSvcTitle").textContent=T.ourServices;
  $("#footSvc").innerHTML=SERVICES.map(s=>`<a href="${linkSvc(l,s.id)}">${esc(tx(s.title,l))}</a>`).join("");
  $("#footLangs").innerHTML=LANGS.map(x=>`<a href="${linkSame(x)}">${UI[x].langName}</a>`).join("");
  $("#footCopy").textContent=`© ${new Date().getFullYear()} ${BRAND.name} ${BRAND.by}`;
  const banner=$("#demoBanner"); banner.hidden=!DEMO; banner.textContent=T.demo;
  renderTabs();
  const app=$("#app"); let shareText=T.waSite(absolute(linkVillas(l))); let title=`${BRAND.name} · Medina First Marrakech`;
  if(state.view==="villa"){
    const v=VILLAS.find(x=>x.slug===state.slug);
    if(v){ app.innerHTML=renderVilla(v); title=`${v.name} · ${title}`; shareText=T.waVilla(v.name, absolute(linkVilla(l,v.slug))); $("#shareTopLbl").textContent=T.share; }
    else { app.innerHTML=`<div class="wrap" style="padding:80px 0"><p class="empty">${T.notFound}</p><p><a class="btn dark" href="${linkVillas(l)}">${T.back}</a></p></div>`; $("#shareTopLbl").textContent=T.shareCatalogue; }
  } else if(state.view==="service"){
    const s=SERVICES.find(x=>x.id===state.svc);
    if(s){ app.innerHTML=renderService(s); title=`${tx(s.title,l)} · ${title}`; shareText=`${tx(s.title,l)} — ${BRAND.name} ${BRAND.by}\n${absolute(linkSvc(l,s.id))}`; }
    else app.innerHTML=`<div class="wrap" style="padding:80px 0"><p class="empty">${T.notFound}</p><p><a class="btn dark" href="${linkVillas(l)}">${T.back}</a></p></div>`;
    $("#shareTopLbl").textContent=T.shareCatalogue;
  } else {
    app.innerHTML=renderVillas(); $("#shareTopLbl").textContent=T.shareCatalogue;
  }
  document.title=title;
  $("#shareTop").onclick=()=>window.open(waShare(shareText),"_blank","noopener");
  window.scrollTo({top:0,behavior:"instant"});
}
window.addEventListener("hashchange",render);
render();
</script>
